name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  check-pages:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages-site.outputs.enabled }}
      notice: ${{ steps.pages-site.outputs.notice }}
    steps:
      - name: Check GitHub Pages configuration
        id: pages-site
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            try {
              const { data } = await github.rest.repos.getPages({ owner, repo });
              const buildType = data.build_type ?? 'legacy';
              core.info(`GitHub Pages is configured for ${data.html_url ?? `${owner}/${repo}`} using the ${buildType} build type.`);

              if (buildType !== 'workflow') {
                const notice = `GitHub Pages is enabled for this repository, but Settings → Pages is still using the ${buildType} source. Switch it to GitHub Actions, then rerun this workflow.`;
                core.warning(notice);
                core.setOutput('notice', notice);
                core.setOutput('enabled', 'false');
                return;
              }

              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status === 404) {
                const notice = 'GitHub Pages is not enabled for this repository yet. Enable Settings → Pages with the GitHub Actions source, then rerun this workflow.';
                core.warning(notice);
                core.setOutput('notice', notice);
                core.setOutput('enabled', 'false');
                return;
              }

              throw error;
            }

  build-and-deploy:
    needs: check-pages
    if: needs.check-pages.outputs.enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  pages-setup-required:
    needs: check-pages
    if: needs.check-pages.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages setup required
        uses: actions/github-script@v7
        env:
          PAGES_NOTICE: ${{ needs.check-pages.outputs.notice }}
        with:
          script: |
            core.notice(process.env.PAGES_NOTICE);
