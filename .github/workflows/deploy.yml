name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check GitHub Pages configuration
        id: pages-site
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            try {
              const { data } = await github.rest.repos.getPages({ owner, repo });
              core.info(`GitHub Pages is configured for ${data.html_url ?? `${owner}/${repo}`}.`);
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.warning('GitHub Pages is not enabled for this repository yet. Enable Settings > Pages with the GitHub Actions source, then rerun this workflow.');
                core.setOutput('enabled', 'false');
                return;
              }

              throw error;
            }

      - name: Setup Pages
        if: steps.pages-site.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        if: steps.pages-site.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: GitHub Pages setup required
        if: steps.pages-site.outputs.enabled != 'true'
        run: echo "::notice::GitHub Pages deployment was skipped because the repository Pages site has not been enabled yet."

      - name: Deploy to GitHub Pages
        if: steps.pages-site.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
